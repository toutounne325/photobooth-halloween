<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Photobooth Halloween</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --orange: #ff7518;
      --orange-glow: #ff9d47;
      --purple-dark: #1f0b2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Verrouillage absolu dans la fenêtre visible Safari iPad (aucun défilement possible) */
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Alerte si l'iPad est tenu en mode Portrait au lieu de Paysage */
    #portrait-warning {
      position: fixed;
      inset: 0;
      background: #0b0711;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      gap: 20px;
    }

    @media (orientation: portrait) {
      #portrait-warning {
        display: flex;
      }
    }

    /* Conteneur principal Paysage occupant 100% de la zone visible */
    #kiosk-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Cadre Paysage 4:3 (ratio natif capteur & écran iPad) */
    #photobooth-stage {
      position: relative;
      aspect-ratio: 4 / 3;
      width: min(100vw, calc(100dvh * 4 / 3));
      height: min(100dvh, calc(100vw * 3 / 4));
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Flux vidéo plein cadre */
    #camera-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    /* Le cadre PNG unique superposé par-dessus la vidéo */
    #frame-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 10;
    }

    /* BOUTON PHOTO INCLUS DANS LE CADRE (flottant en bas au centre) */
    #shutter-button {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--orange), var(--orange-glow));
      border: 5px solid #ffffff;
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 117, 24, 0.9);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    #shutter-button:active {
      transform: translateX(-50%) scale(0.9);
    }

    #shutter-button svg {
      width: 44px;
      height: 44px;
      fill: #000000;
    }

    /* Décompte 3, 2, 1 au centre du cadre */
    #countdown-layer {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    #countdown-number {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(31, 11, 46, 0.9);
      border: 5px solid var(--orange);
      box-shadow: 0 0 40px var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 110px;
      font-weight: 900;
      color: var(--orange);
      animation: popScale 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
    }

    @keyframes popScale {
      0% { transform: scale(1.45); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Flash blanc */
    #flash-layer {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: none;
      z-index: 100;
    }

    /* Écran de résultat Paysage */
    #result-view {
      position: fixed;
      inset: 0;
      background: #0a0710;
      display: none;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      padding: 20px 28px;
      align-items: center;
      z-index: 80;
    }

    .result-photo-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #result-img {
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      border: 3px solid var(--orange);
      box-shadow: 0 0 30px rgba(255, 117, 24, 0.4);
      object-fit: contain;
    }

    .result-sidebar {
      background: #161122;
      border: 2px solid var(--orange);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .qr-box {
      background: #ffffff;
      padding: 10px;
      border-radius: 14px;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    #progress-fill {
      width: 100%;
      height: 100%;
      background: var(--orange);
    }

    .btn-main {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      background: var(--purple-dark);
      border: 2px solid var(--orange);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Zone invisible Admin (coin supérieur droit : triple-clic OU appui long) */
    #admin-hotspot {
      position: fixed;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      z-index: 90;
    }

    /* Modale Admin */
    #admin-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .admin-box {
      background: #181326;
      border: 2px solid var(--orange);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .admin-box h2 {
      color: var(--orange);
      font-size: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: #ccc;
    }

    .field input, .field select {
      background: #09070e;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .upload-zone {
      border: 2px dashed var(--orange);
      background: rgba(255, 117, 24, 0.12);
      color: var(--orange);
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: 800;
      cursor: pointer;
    }

    #drive-test-msg {
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.4);
      color: #aaa;
    }
  </style>

      <button class="btn-main" style="background: var(--orange); color: #000;" onclick="saveAndCloseAdmin()">

    // 1. Base de données locale IndexedDB pour sauvegarder un PNG lourd sans limite de taille sur iPad
    function openFrameDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('PhotoboothDB', 1);
        req.onupgradeneeded = (e) => {
          e.target.result.createObjectStore('frames');
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e);
      });
    }

    async function saveFrameToDB(dataUrl) {
      const db = await openFrameDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('frames', 'readwrite');
        tx.objectStore('frames').put(dataUrl, 'single_active_frame');
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
      });
    }

    async function loadFrameFromDB() {
      try {
        const db = await openFrameDB();
        return new Promise((resolve) => {
          const tx = db.transaction('frames', 'readonly');
          const req = tx.objectStore('frames').get('single_active_frame');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (_) {
        return null;
      }
    }
